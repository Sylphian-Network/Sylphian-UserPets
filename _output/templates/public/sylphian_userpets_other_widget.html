<xf:css src="sylphian_userpets_widget.less" />

<div class="block petWidget" data-widget-id="{$widget.id}" data-widget-key="{$widget.key}" data-widget-definition="{$widget.definition}">
	<div class="block-container js-petWidget">
		<h3 class="block-minorHeader petWidget-header">
			<xf:if is="$custom_pet_name">
				<span class="petWidget-name">{$custom_pet_name}</span>
				<span class="petWidget-owner">{$ownerPetTitle}</span>
			<xf:else />
				<span class="petWidget-name">{$ownerPetTitle}</span>
			</xf:if>
		</h3>

		<div class="block-body block-row">
			<xf:macro id="sylphian_userpets_macros::pet_display"
				arg-pet="{$pet}"
				arg-petRender="{$petRender}"
				arg-label="{{ $custom_pet_name ?: $ownerPetTitle }}"
				arg-stateDisplay="{$stateDisplay}"
				arg-scaleMin="{$scaleMin}"
				arg-scaleMax="{$scaleMax}" />
		</div>

		<xf:if is="$canChallengePets">
			<div class="block-footer petWidget-footer">
				<xf:button href="{{ link('userpetsduel/challenge', null, {'opponent_pet_id': $pet.pet_id}) }}"
					class="button--small button--primary"
					fa="fa-swords"
					overlay="true">{{ phrase('sylphian_userpets_duel_action_challenge') }}</xf:button>
			</div>
		</xf:if>
	</div>
</div>
