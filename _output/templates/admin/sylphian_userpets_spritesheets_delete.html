<xf:title>{{ phrase('confirm_action') }}</xf:title>

<xf:css src="sylphian_userpets_admin.less" />

<xf:form action="{{ link('sylphian_userpets-spritesheets/delete') }}" ajax="true" class="block">
	<div class="block-container">
		<div class="block-body">
			<xf:inforow rowtype="confirm">
				{{ phrase('please_confirm_that_you_want_to_delete_following:') }}
				<strong>{$filename}</strong>
			</xf:inforow>

			<xf:if is="$exists">
				<xf:formrow label="{{ phrase('preview') }}">
					<img src="{$url}" alt="{$filename}" class="spritesheetDelete-image" />
				</xf:formrow>
			<xf:else />
				<xf:inforow>
					<div class="block-rowMessage block-rowMessage--warning block-rowMessage--iconic">
						{{ phrase('sylphian_userpets_delete_missing_file_warning') }}
					</div>
				</xf:inforow>
			</xf:if>
		</div>

		<xf:hiddenval name="file" value="{$filename}" />

		<xf:submitrow icon="delete" rowtype="simple" />
	</div>
</xf:form>
