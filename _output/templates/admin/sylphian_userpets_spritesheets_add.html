<xf:title>{{ phrase('sylphian_userpets_add_spritesheet_title') }}</xf:title>

<xf:form action="{{ link('sylphian_userpets/spritesheets/save') }}" ajax="true" class="block" enctype="multipart/form-data">
	<div class="block-container">
		<div class="block-body">
			<xf:uploadrow name="image"
				label="{{ phrase('image') }}"
				required="required"
				accept=".png,.gif,.jpg,.jpeg,.webp"
				explain="{{ phrase('sylphian_userpets_upload_spritesheet_image_explain') }}" />

			<xf:textboxrow name="filename" value=""
				label="{{ phrase('sylphian_userpets_filename') }}"
				explain="{{ phrase('sylphian_userpets_filename_explain') }}" />

			<xf:textboxrow name="title" value="" label="{{ phrase('title') }}" />

			<hr class="formRowSep" />

			<xf:numberboxrow name="frame_width" value="{$entity.frame_width}" min="1" step="1"
				label="{{ phrase('sylphian_userpets_frame_width_px') }}" />
			<xf:numberboxrow name="frame_height" value="{$entity.frame_height}" min="1" step="1"
				label="{{ phrase('sylphian_userpets_frame_height_px') }}" />
			<xf:numberboxrow name="frames_per_animation" value="{$entity.frames_per_animation}" min="1" step="1"
				label="{{ phrase('sylphian_userpets_frames_per_animation_columns') }}" />
			<xf:numberboxrow name="fps" value="{$entity.fps}" min="1" max="120" step="1"
				label="{{ phrase('sylphian_userpets_fps_widget_label') }}" />

			<hr class="formRowSep" />

			<xf:selectrow name="evolves_to" value="{$entity.evolves_to}"
				label="{{ phrase('sylphian_userpets_evolves_into') }}"
				explain="{{ phrase('sylphian_userpets_evolves_into_explain') }}">
				<xf:option value="">{{ phrase('none') }}</xf:option>
				<xf:options source="{$evolutionTargets}" />
			</xf:selectrow>
			<xf:numberboxrow name="evolve_level" value="{{ max($entity.evolve_level, $minEvolveLevel) }}" min="{$minEvolveLevel}" max="65535" step="1"
				label="{{ phrase('sylphian_userpets_evolve_at_level') }}"
				explain="{{ phrase('sylphian_userpets_evolve_level_explain', {'level': $minEvolveLevel}) }}" />
		</div>

		<xf:hiddenval name="spritesheet_id" value="0" />
		<xf:hiddenval name="file" value="" />

		<xf:submitrow icon="save" sticky="true" />
	</div>
</xf:form>
